<!doctype html>
<html><head><meta charset="utf-8"><title>globe test</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="timeline.js"></script>
<script src="layout.js"></script>
<script src="globe.js"></script>
<script>
function bg(g, a, b) {
  const gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, a || '#0b1030'); gr.addColorStop(1, b || '#1a0f3a');
  g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080);
  const r = rng(7); g.fillStyle = 'rgba(255,255,255,0.7)';
  for (let i = 0; i < 160; i++) { g.fillRect(r() * 1920, r() * 1080, 1.5, 1.5); }
}
const SHEETS = {
  0: function (g) { // mask debug
    GLOBE.warm(); bg(g); const m = GLOBE._debug.mask(); g.drawImage(m, 0, 0, 1920, 960);
  },
  1: function (g) {
    bg(g);
    const L = [-90, 20, 105, 180];
    for (let i = 0; i < 4; i++) GLOBE.draw(g, 250 + i * 475, 540, 215, { lon: L[i], lat: 12, sunLon: L[i] - 55, sunLat: 10, tNow: 3 });
  },
  2: function (g) {
    bg(g);
    const S = [-1, 0, 0.5, 1];
    for (let i = 0; i < 4; i++) GLOBE.draw(g, 250 + i * 475, 540, 215, { lon: 20, lat: 15, sunLon: -20, sunLat: 8, sea: S[i], tNow: 3 });
  },
  3: function (g) {
    bg(g);
    const cfg = [[0, 60, 25], [1, 60, 25], [0, -60, -25], [1, -60, -25]];
    for (let i = 0; i < 4; i++) GLOBE.draw(g, 250 + i * 475, 540, 215, { lon: 40, lat: cfg[i][1], sunLon: 40, sunLat: cfg[i][2], sea: cfg[i][0], tNow: 3, clouds: 0.25 });
  },
  4: function (g) {
    bg(g);
    GLOBE.draw(g, 600, 540, 420, { lon: 80, lat: 18, sunLon: 20, sunLat: 14, tNow: 3 });
    GLOBE.draw(g, 1500, 540, 300, { lon: -70, lat: 20, sunLon: -150, sunLat: 5, tNow: 3, sea: 0.5 });
  },
  5: function (g) {
    bg(g);
    GLOBE.draw(g, 480, 540, 330, { lon: 15, lat: 6, sunLon: -40, sunLat: 5, oblate: 1, spinArrow: 1, tNow: 1.2 });
    GLOBE.draw(g, 1200, 540, 330, { lon: 100, lat: 25, sunLon: 40, sunLat: 5, oblate: 0.5, spinArrow: 0.6, tNow: 1.2 });
    GLOBE.draw(g, 1700, 300, 120, { lon: 100, lat: 25, sunLon: 40, sunLat: 5, spinArrow: 1, tNow: 2 });
  },
  6: function (g) {
    bg(g);
    const K = [0, 0.5, 1];
    for (let i = 0; i < 3; i++) GLOBE.bulgeDiagram(g, 340 + i * 620, 540, 270, { k: K[i], water: 1, tNow: 1.1 });
  },
  7: function (g) {
    bg(g);
    GLOBE.dayNightSplit(g, 340, 540, 270, { wind: 0, hurricane: 0, tNow: 1 });
    GLOBE.dayNightSplit(g, 960, 540, 270, { wind: 1, hurricane: 0.35, tNow: 1.3 });
    GLOBE.dayNightSplit(g, 1580, 540, 270, { wind: 0.7, hurricane: 0.9, tNow: 2 });
  },
  8: function (g) {
    bg(g, '#101835', '#241648');
    const S = [[0.35, 0], [1, 0.0], [1, 0.5], [1, 1]];
    for (let i = 0; i < 4; i++) GLOBE.dial(g, 250 + i * 475, 540, 210, { from: 1670, to: 417, pop: S[i][0], k: S[i][1], tNow: 1.5 });
  },
  9: function (g) { // sea timeline strip, lon 150 (Pacific/Asia) and lon -30
    bg(g);
    const S = [-1, -0.5, 0, 0.5, 1];
    for (let i = 0; i < 5; i++) { GLOBE.draw(g, 200 + i * 380, 300, 170, { lon: 100, lat: 20, sunLon: 60, sunLat: 8, sea: S[i], tNow: 3, clouds: 0.3 });
      GLOBE.draw(g, 200 + i * 380, 750, 170, { lon: -60, lat: 20, sunLon: -100, sunLat: 8, sea: S[i], tNow: 3, clouds: 0.3 }); }
  },
  10: function (g) { // timing
    bg(g);
    const t0 = performance.now(); GLOBE.warm(); const tb = performance.now() - t0;
    function tm(fn, n) { fn(); const a = performance.now(); for (let i = 0; i < n; i++) fn(); return (performance.now() - a) / n; }
    let k = 0;
    const d1 = tm(() => GLOBE.draw(g, 960, 540, 420, { lon: (k += 7), lat: 15, sunLon: 0, sunLat: 10, sea: 0.3, tNow: k * 0.1 }), 20);
    const d2 = tm(() => GLOBE.draw(g, 960, 540, 215, { lon: (k += 7), lat: 15, sunLon: 0, sunLat: 10, tNow: k * 0.1 }), 20);
    const b = tm(() => GLOBE.bulgeDiagram(g, 960, 540, 330, { k: 0.5, tNow: k * 0.1 }), 20);
    const w = tm(() => GLOBE.dayNightSplit(g, 960, 540, 330, { wind: 1, hurricane: 0.6, tNow: (k += 0.1) }), 20);
    const di = tm(() => GLOBE.dial(g, 960, 540, 260, { pop: 1, k: 0.5, tNow: k }), 20);
    console.warn('TIMING build=' + tb.toFixed(0) + 'ms draw420=' + d1.toFixed(1) + ' draw215=' + d2.toFixed(1) + ' bulge=' + b.toFixed(1) + ' split=' + w.toFixed(1) + ' dial=' + di.toFixed(1));
  }
};
(function () { // report the first-call (cache build) cost once
  const d0 = GLOBE.draw; let first = true;
  GLOBE.draw = function () { if (first) { first = false; const a = performance.now(); d0.apply(GLOBE, arguments); console.warn('FIRSTDRAW ' + (performance.now() - a).toFixed(0) + 'ms'); } else d0.apply(GLOBE, arguments); };
})();
window.drawFrame = function (g, T) {
  const f = SHEETS[Math.round(T)] || SHEETS[1];
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  f(g);
};
</script>
<script src="harness.js"></script>
</body></html>

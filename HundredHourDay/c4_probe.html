<!doctype html>
<html><head><meta charset="utf-8"><title>c4 harness</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="timeline.js"></script>
<script src="layout.js"></script>
<script src="world.js"></script>
<script src="rigs.js"></script>
<script src="scenes.js"></script>
<script src="tod.js"></script>
<script src="mascot.js"></script>
<script src="globe.js"></script>
<script src="full.js"></script>
<script src="ch/c4.js"></script>
<script src="harness.js"></script>
<script>
(function(){
const g=document.getElementById('c').getContext('2d'); TOD.warm();
const rd=()=>g.getImageData(0,0,1,1);
const avg=(f)=>{ f(); rd(); const t0=performance.now(); for(let i=0;i<8;i++){ f(); } rd(); return ((performance.now()-t0)/8).toFixed(1); };
const out=[];
for(const sc of ['city','desert','farm','coast']){
  const lt=40, H=47, o={scene:sc,heat:0.5,t:lt}, cam={x:900,y:573,z:1.55,r:0};
  const st={x:900,y:820,s:1.3,facing:1,pose:{name:'walk',speed:.5},t:lt,expr:{eyes:'happy'},props:{sunglasses:1,towel:true},shadow:false,pal:TOD.heroPal(H,o)};
  out.push(sc+' world '+avg(()=>TOD.drawWorld(g,cam,H,o))+' fg '+avg(()=>TOD.drawForeground(g,cam,H,o))+' warp '+avg(()=>TOD.heatWarp(g,560,900,0.5,lt))+' glare '+avg(()=>TOD.heatGlare(g,0.5,lt))+' grade '+avg(()=>TOD.grade(g,H,o))+' hud '+avg(()=>TOD.hud(g,H,{alpha:1,pop:1,pulse:0}))+' hero '+avg(()=>withLayer(g,cam,1,()=>MASCOT.draw(g,st)))+' cast '+avg(()=>withLayer(g,cam,1,()=>TOD.drawCastShadow(g,H,900,820,1.3,(c)=>{MASCOT.draw(c,{x:0,y:0,s:1,facing:1,pose:{name:'walk',speed:.5},t:lt,expr:'neutral',pal:TOD.PAL_SHADOW,shadow:false});},o))));
}
console.error('PROBE '+out.join(' || '));
})();
</script></body></html>
